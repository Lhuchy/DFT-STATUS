<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo - Análise DFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .chart-container {
            position: relative;
            height: 40vh;
            width: 100%;
        }
        .bar-chart-container {
            position: relative;
            height: 50vh; /* Aumentar altura para melhor visualização */
            width: 100%;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-2">Dashboard de Análise DFT</h1>
            <p class="text-gray-600">Carregue seu arquivo .xlsx para visualizar os dados mais recentes.</p>
        </header>

        <!-- Seção de Upload -->
        <div class="mb-8 bg-white p-6 rounded-xl shadow-md flex flex-col items-center">
            <label for="fileInput" class="block text-lg font-medium text-gray-700 mb-4">Selecione o arquivo XLSX:</label>
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 shadow-md">
                <span>Carregar Arquivo</span>
                <input type="file" id="fileInput" class="hidden" accept=".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
            </label>
            <p id="fileName" class="text-gray-500 mt-3 text-sm"></p>
        </div>

        <!-- Seção de Métricas Principais -->
        <div id="metrics-section" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 hidden">
            <div class="bg-white p-6 rounded-xl shadow-md text-center">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Total de DFTs</h3>
                <p id="totalUnidades" class="text-4xl font-bold text-gray-900 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Total de Pessoas</h3>
                <p id="totalPessoas" class="text-4xl font-bold text-gray-900 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Pessoas c/ Esforço</h3>
                <p id="pessoasComEsforco" class="text-4xl font-bold text-green-600 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Faltam Preencher</h3>
                <p id="pessoasFaltando" class="text-4xl font-bold text-red-600 mt-2">-</p>
            </div>
        </div>
        
        <!-- Seção de Gráficos -->
        <div id="charts-section" class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 hidden">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold text-gray-900 mb-4 text-center">Entregas Adicionadas</h2>
                <div class="chart-container">
                    <canvas id="entregasChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-semibold text-gray-900 mb-4 text-center">Conclusão do Esforço (100%)</h2>
                <div class="chart-container">
                    <canvas id="esforcoChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Novo Gráfico de Barras -->
        <div id="bar-chart-section" class="bg-white p-6 rounded-xl shadow-md hidden">
             <h2 class="text-xl font-semibold text-gray-900 mb-4 text-center">Comparativo de Pessoas</h2>
             <div class="bar-chart-container">
                <canvas id="pessoasChart"></canvas>
             </div>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const metricsSection = document.getElementById('metrics-section');
        const chartsSection = document.getElementById('charts-section');
        const barChartSection = document.getElementById('bar-chart-section');

        let entregasChartInstance = null;
        let esforcoChartInstance = null;
        let pessoasChartInstance = null;

        // Registrar plugin de rótulos
        Chart.register(ChartDataLabels);

        // Configurações globais para os gráficos
        Chart.defaults.color = '#4b5563'; // Cor cinza para texto
        Chart.defaults.font.family = "'Inter', 'sans-serif'";

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileNameDisplay.textContent = `Arquivo: ${file.name}`;
                parseXLSX(file);
            }
        });

        function parseXLSX(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    processDataAndRender(json);
                } catch (error) {
                    console.error("Erro ao processar o arquivo XLSX:", error);
                    alert("Não foi possível processar o arquivo. Verifique se o formato está correto.");
                }
            };
            reader.onerror = function(error) {
                console.error("Erro ao ler o arquivo:", error);
                alert("Não foi possível ler o arquivo.");
            };
            reader.readAsArrayBuffer(file);
        }

        function processDataAndRender(data) {
            // --- Cálculos ---
            const totalUnidades = data.length;
            // A análise de entregas agora usa a coluna "Entregas adicionadas"
            const unidadesComEntregas = data.filter(row => row['Entregas adicionadas'] === 'Sim').length;
            
            // Corrigido para tratar valores como string ou número
            const unidadesComEsforcoConcluido = data.filter(row => {
                const esforco = row['% de Esforço'];
                return parseFloat(esforco) >= 100;
            }).length;

            const totalPessoas = data.reduce((sum, row) => sum + (parseInt(row['Qtd. Pessoas']) || 0), 0);
            const pessoasComEsforco = data.reduce((sum, row) => sum + (parseInt(row['Qtd. Pessoas c/ Esforço']) || 0), 0);
            const pessoasFaltando = totalPessoas - pessoasComEsforco;

            // --- Exibir seções ---
            metricsSection.classList.remove('hidden');
            chartsSection.classList.remove('hidden');
            barChartSection.classList.remove('hidden');
            
            // --- Atualizar Métricas ---
            document.getElementById('totalUnidades').textContent = totalUnidades;
            document.getElementById('totalPessoas').textContent = totalPessoas;
            document.getElementById('pessoasComEsforco').textContent = pessoasComEsforco;
            document.getElementById('pessoasFaltando').textContent = pessoasFaltando;
            
            // --- Atualizar Gráficos ---
            renderEntregasChart(unidadesComEntregas, totalUnidades - unidadesComEntregas);
            renderEsforcoChart(unidadesComEsforcoConcluido, totalUnidades - unidadesComEsforcoConcluido);
            renderPessoasChart(totalPessoas, pessoasComEsforco, pessoasFaltando);
        }
        
        const doughnutChartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 20,
                        font: { size: 14 }
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.7)',
                    titleFont: { size: 16 },
                    bodyFont: { size: 14 },
                    padding: 10,
                    bodyColor: '#fff',
                    titleColor: '#fff'
                },
                datalabels: {
                    formatter: (value, ctx) => {
                        let sum = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                        if (sum === 0) return '0.00%';
                        let percentage = (value * 100 / sum).toFixed(2) + "%";
                        return percentage;
                    },
                    color: '#fff',
                    font: {
                        weight: 'bold',
                        size: 14
                    }
                }
            }
        };

        function renderEntregasChart(comEntregas, semEntregas) {
            const ctx = document.getElementById('entregasChart').getContext('2d');
            if (entregasChartInstance) entregasChartInstance.destroy();
            entregasChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Com Entregas', 'Sem Entregas'],
                    datasets: [{
                        data: [comEntregas, semEntregas],
                        backgroundColor: ['#16a34a', '#dc2626'],
                        borderColor: '#ffffff',
                        borderWidth: 4,
                        hoverOffset: 8
                    }]
                },
                options: doughnutChartOptions
            });
        }

        function renderEsforcoChart(concluido, naoConcluido) {
            const ctx = document.getElementById('esforcoChart').getContext('2d');
            if (esforcoChartInstance) esforcoChartInstance.destroy();
            esforcoChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Esforço ≥ 100%', 'Esforço < 100%'],
                    datasets: [{
                        data: [concluido, naoConcluido],
                        backgroundColor: ['#2563eb', '#f97316'],
                        borderColor: '#ffffff',
                        borderWidth: 4,
                        hoverOffset: 8
                    }]
                },
                options: doughnutChartOptions
            });
        }

        function renderPessoasChart(total, comEsforco, faltando) {
             const ctx = document.getElementById('pessoasChart').getContext('2d');
             if (pessoasChartInstance) pessoasChartInstance.destroy();
             pessoasChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Total de Pessoas', 'Com Esforço Preenchido', 'Faltam Preencher'],
                    datasets: [{
                        label: 'Quantidade de Pessoas',
                        data: [total, comEsforco, faltando],
                        backgroundColor: [
                            '#6b7280', // cinza
                            '#16a34a', // verde
                            '#dc2626'  // vermelho
                        ],
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y', // Gráfico de barras horizontal
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                           color: '#fff',
                           anchor: 'center',
                           align: 'center',
                           font: { weight: 'bold' }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                             grid: {
                                color: '#e5e7eb'
                             }
                        },
                        y: {
                             grid: {
                                display: false
                             }
                        }
                    }
                }
             });
        }

    </script>
</body>
</html>
